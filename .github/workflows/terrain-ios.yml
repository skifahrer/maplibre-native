name: terrain-ios

# Builds MapLibre iOS from the upstream commits upstream.env pins, with our patches, and
# tests it on a simulator: on a pull request to check it, on master to release it.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and release even if master's pins already have a release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: terrain-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  UPSTREAM: maplibre/maplibre-native
  BRANCH: feature/terrain-3d
  MAIN: main
  BAZEL_FLAGS: --compilation_mode=opt --//:renderer=metal --features=thin_lto --apple_generate_dsym

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pins.outputs.sha }}
      main_sha: ${{ steps.pins.outputs.main_sha }}
      tag: ${{ steps.pins.outputs.tag }}
      build: ${{ steps.pins.outputs.build }}
      release: ${{ steps.pins.outputs.release }}
    steps:
      # our patches go into the tag, so a patched build never reuses an unpatched release
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            patches
            upstream.env
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: pins
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
          RELEASING: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        run: |
          . ./upstream.env
          sha=$TERRAIN_SHA main_sha=$MAIN_SHA
          tag="terrain-${sha:0:7}-main-${main_sha:0:7}"
          if ls patches/*.patch > /dev/null 2>&1; then
            tag="$tag-p$(cat patches/*.patch | shasum | cut -c1-7)"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASING" >> "$GITHUB_OUTPUT"
          if [ "$RELEASING" = true ] && [ "$FORCE" != true ] &&
             gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::$tag is already released."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
          # deepened to the merge base with main below; blobs only for what the merge touches
          fetch-depth: 1
          filter: blob:none

      # main's fixes in; its changelog lines are the only conflict we resolve
      - name: Merge upstream main
        env:
          SHA: ${{ needs.check.outputs.sha }}
          MAIN_SHA: ${{ needs.check.outputs.main_sha }}
        run: |
          # Homebrew's git 2.56 lazily fetches an object no upstream ref reaches during the
          # merge, which GitHub refuses ("not our ref"); Apple's git merges the same commits.
          git() { /usr/bin/git "$@"; }
          git --version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags --filter=blob:none --depth=1 origin "$MAIN_SHA"
          # Both histories only as deep as the commit they share, not all of upstream's
          for _ in $(seq 1 40); do
            git merge-base HEAD "$MAIN_SHA" > /dev/null 2>&1 && break
            git fetch --no-tags --filter=blob:none --deepen=250 origin "$SHA" "$MAIN_SHA"
          done
          git merge-base HEAD "$MAIN_SHA" > /dev/null 2>&1 || git fetch --no-tags --filter=blob:none --unshallow origin "$SHA" "$MAIN_SHA"
          if ! git merge --no-edit -m "Merge $MAIN ${MAIN_SHA:0:7} into $BRANCH" "$MAIN_SHA"; then
            others=$(git diff --name-only --diff-filter=U | grep -v 'CHANGELOG\.md$' || true)
            if [ -n "$others" ]; then
              echo "::error::$MAIN does not merge into $BRANCH: $others"
              exit 1
            fi
            git diff --name-only --diff-filter=U | xargs git checkout --ours --
            git add -A
            git commit --no-edit
          fi
          # Each submodule at its pinned commit only, all at once
          git submodule update --init --recursive --depth 1 --jobs 8 ||
            git submodule update --init --recursive --jobs 8
          git log -1 --format='%H %s'

      - uses: actions/checkout@v4
        with:
          path: .ours
          sparse-checkout: |
            patches
            tests
          persist-credentials: false

      # What upstream does not have yet, such as iOS switches the core already offers
      - name: Apply our patches
        run: |
          for patch in .ours/patches/*.patch; do
            [ -e "$patch" ] || continue
            echo "applying $patch"
            git apply --index "$patch"
          done
          git diff --cached --quiet || git commit -q -m "Our patches"
          git log -1 --format='%H %s'

      # Every compile the last build did; a patch or a moved main reuses all it did not touch.
      - name: Restore the Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-ios-${{ needs.check.outputs.sha }}-${{ needs.check.outputs.main_sha }}-${{ github.run_id }}
          restore-keys: |
            bazel-ios-${{ needs.check.outputs.sha }}-${{ needs.check.outputs.main_sha }}-
            bazel-ios-${{ needs.check.outputs.sha }}-
            bazel-ios-

      # The same flags as upstream's ios-release, so the framework is as small as theirs.
      - name: Build the XCFramework
        run: |
          # shellcheck disable=SC2086
          bazel build --disk_cache="$HOME/.cache/bazel-disk" --experimental_disk_cache_gc_max_size=6G \
            $BAZEL_FLAGS --features=dead_strip --objc_enable_binary_stripping \
            --output_groups=+dsyms \
            //platform/ios:MapLibre.dynamic
          echo "BIN=$(bazel info --compilation_mode=opt bazel-bin)/platform/ios" >> "$GITHUB_ENV"

      # The zip carries ~570 MB of dSYMs; they go in a release asset of their own.
      - name: Package
        run: |
          mkdir -p out x
          unzip -q "$BIN/MapLibre.dynamic.xcframework.zip" -d x
          chmod -R u+w x
          rm -rf x/MapLibre.xcframework/*/dSYMs
          for i in 0 1 2 3; do
            /usr/libexec/PlistBuddy -c "Delete :AvailableLibraries:$i:DebugSymbolsPath" \
              x/MapLibre.xcframework/Info.plist 2> /dev/null || true
          done
          cp LICENSE.md x/MapLibre.xcframework/
          (cd x && ditto -c -k --keepParent MapLibre.xcframework ../out/MapLibre.xcframework.zip)
          (cd "$BIN/MapLibre.dynamic_dsyms" &&
            ditto -c -k --keepParent MapLibre_ios_device.framework.dSYM "$GITHUB_WORKSPACE/out/MapLibre.framework.dSYM.zip")
          swift package compute-checksum out/MapLibre.xcframework.zip > out/checksum.txt
          ls -la out
          du -sh x/MapLibre.xcframework/ios-arm64/MapLibre.framework/MapLibre

      # Upstream's iOS tests and ours, on the simulator, with the compiles the build made.
      - name: Test on a simulator
        run: |
          cp -R .ours/tests/ios platform/ios/riki-test
          # shellcheck disable=SC2086
          bazel test --disk_cache="$HOME/.cache/bazel-disk" --experimental_disk_cache_gc_max_size=6G \
            $BAZEL_FLAGS --test_output=errors \
            //platform/ios/test:ios_test //platform/ios/riki-test:riki_test

      # Kept under 6 GB by Bazel, inside the repository's 10 GB of Actions cache.
      - name: Save the Bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-ios-${{ needs.check.outputs.sha }}-${{ needs.check.outputs.main_sha }}-${{ github.run_id }}

      # A pull request or another branch builds and tests, and publishes nothing.
      - name: Release
        if: needs.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
          MAIN_SHA: ${{ needs.check.outputs.main_sha }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes 2> /dev/null || true
          subject=$(git log -1 --format=%s "$SHA")
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "iOS terrain build ${SHA:0:7} + main ${MAIN_SHA:0:7}" \
            --notes "MapLibre Native iOS from [$UPSTREAM@${SHA:0:7}](https://github.com/$UPSTREAM/commit/$SHA) on \`$BRANCH\`: $subject, with \`$MAIN\` at [${MAIN_SHA:0:7}](https://github.com/$UPSTREAM/commit/$MAIN_SHA) merged in

          Checksum: \`$(cat out/checksum.txt)\`" \
            out/MapLibre.xcframework.zip out/MapLibre.framework.dSYM.zip out/checksum.txt
