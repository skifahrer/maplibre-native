name: terrain-ios

# Builds MapLibre iOS from this repository and tests it on a simulator: on a pull request, or a
# dispatch on a branch, to check it; on master to release it.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and release even if this commit already has a release
        type: boolean
        default: false
      runner:
        description: Apple silicon on Xcode 27; intel only by hand, on Xcode 26, its simulator draws terrain otherwise
        type: choice
        options: [apple, intel]
        default: apple

permissions:
  actions: write
  contents: write
  statuses: write

# 107: master too, where the newest merge carries every change since the last release
# 146: by branch, so a pull request's run and a dispatch on its branch stop each other
concurrency:
  group: terrain-ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  BAZEL_FLAGS: --compilation_mode=opt --//:renderer=metal --features=thin_lto --apple_generate_dsym
  BAZEL_CACHE: --disk_cache=/Users/runner/.cache/bazel-disk --experimental_disk_cache_gc_max_size=6G
  # one simulator at a time: two booting together can fail on a small runner
  # a disk-cached pass is replayed for unchanged inputs, but a simulator test is not hermetic
  BAZEL_TEST: --test_output=errors --local_test_jobs=1 --test_timeout=3600 --nocache_test_results

jobs:
  check:
    # 90: another repository's pull request gets a read-only token
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      ref: ${{ steps.plan.outputs.ref }}
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
          PR_BASE: ${{ github.event.pull_request.base.sha || '' }}
          BEFORE: ${{ github.event.before || '' }}
          FORCE: ${{ inputs.force || false }}
        run: |
          release=false build=true
          if [ -n "$PR_HEAD" ]; then
            sha=$PR_HEAD ref=$GITHUB_REF
          else
            sha=$GITHUB_SHA ref=$GITHUB_SHA
            [ "$GITHUB_REF" = refs/heads/master ] && release=true
          fi
          tag="terrain-${sha:0:7}"
          # workflows and docs alone change nothing in the framework; run by hand to try a workflow
          from=${PR_BASE:-$BEFORE}
          # on master, against the last release: a cancelled run may have left a change unreleased
          if [ "$release" = true ] && [ -n "$BEFORE" ]; then
            from=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
                     -q '[.[] | select(.tag_name | startswith("terrain-"))][0].target_commitish // ""' || true)
          fi
          # 146: a dispatch is weighed against master, so a booking commit builds nothing
          [ -z "$from" ] && [ -z "$PR_HEAD" ] && [ "$release" = false ] && from=master
          if [ -n "$from" ] && [ "$from" != 0000000000000000000000000000000000000000 ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$from...$sha" -q '.files[].filename' || echo unknown)
            if [ -z "$files" ]; then
              echo "::notice::no file changed; nothing to build"
              build=false release=false pipeline_only=true
            elif [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ "$(echo "$files" | wc -l)" -lt 300 ] &&
               ! echo "$files" | grep -qvE '^\.github/|\.md$'; then
              echo "::notice::only workflows or docs changed; nothing to build"
              build=false release=false pipeline_only=true
            fi
          fi
          if [ "$release" = true ] && [ "$FORCE" != true ] &&
             gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::$tag is already released."
            build=false
          fi
          {
            echo "sha=$sha"
            echo "ref=$ref"
            echo "tag=$tag"
            echo "build=$build"
            echo "release=$release"
            echo "pipeline_only=${pipeline_only:-false}"
          } >> "$GITHUB_OUTPUT"

      - name: Mark the commit done, nothing to build
        if: steps.plan.outputs.pipeline_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context=terrain-ios \
            -f description="Only workflows or docs changed" || true

      # set here, where a runner is always free: a build dropped for lack of a Mac stays pending
      - name: Mark the commit pending
        if: steps.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.plan.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context=terrain-ios \
            -f target_url="$RUN_URL" -f description="Building and testing on a simulator" || true

  # The arm64 pool drops a job it cannot take within about 15 minutes; this run then
  # starts again on Apple silicon (147: never Intel, whose simulator fails occlusion).
  # 153: a build still queued keeps its place; starting again put it at the back.
  again-if-no-mac:
    needs: check
    if: needs.check.outputs.build == 'true' && inputs.runner != 'intel'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
      FORCE: ${{ inputs.force || false }}
    steps:
      - name: Start again if no Apple silicon Mac takes the build
        run: |
          build() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
              -q ".jobs[] | select(.name == \"build\") | \"\\(.status) \\(.conclusion) \\(.runner_id // 0)\""
          }
          # until a Mac takes the build or the pool drops it
          while :; do
            sleep 60
            read -r status conclusion runner <<< "$(build)"
            case "$status" in
              queued | waiting | pending | "") ;;
              completed) [ "$conclusion" = cancelled ] && [ "$runner" = 0 ] && break; exit 0 ;;
              *) echo "build taken by runner $runner"; exit 0 ;;
            esac
          done
          # a pull request merged meanwhile has no branch left; master's own run builds it
          if ! gh api "repos/$GITHUB_REPOSITORY/branches/$BRANCH" --silent 2>/dev/null; then
            echo "::notice::$BRANCH is gone; master's run builds it"
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"
            exit 0
          fi
          echo "::warning::no Apple silicon Mac took the build; starting this run again"
          gh workflow run terrain-ios.yml -R "$GITHUB_REPOSITORY" --ref "$BRANCH" \
            -f runner=apple -f force="$FORCE"
          gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    # Apple silicon: Intel runs the core's timing tests 5-10x slower. A run no arm64 Mac
    # takes is started again by again-if-no-mac.
    # 171: Xcode 27, as the app is built with; GitHub has no Intel image of it
    runs-on: ${{ inputs.runner == 'intel' && 'macos-26-intel' || 'xcode-27' }}
    timeout-minutes: 240
    env:
      SHA: ${{ needs.check.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.ref }}
          submodules: recursive
          persist-credentials: false

      - name: Restore the Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-ios-xcode27-${{ runner.arch }}-${{ needs.check.outputs.sha }}-${{ github.run_id }}
          restore-keys: |
            bazel-ios-xcode27-${{ runner.arch }}-${{ needs.check.outputs.sha }}-
            bazel-ios-xcode27-${{ runner.arch }}-

      # The same flags as upstream's ios-release, so the framework is as small as theirs.
      - name: Build the XCFramework
        run: |
          # shellcheck disable=SC2086
          bazel build $BAZEL_CACHE $BAZEL_FLAGS \
            --features=dead_strip --objc_enable_binary_stripping --output_groups=+dsyms \
            //platform/ios:MapLibre.dynamic
          echo "BIN=$(bazel info --compilation_mode=opt bazel-bin)/platform/ios" >> "$GITHUB_ENV"

      # The zip carries ~570 MB of dSYMs; they go in a release asset of their own.
      - name: Package
        run: |
          mkdir -p out x
          unzip -q "$BIN/MapLibre.dynamic.xcframework.zip" -d x
          chmod -R u+w x
          rm -rf x/MapLibre.xcframework/*/dSYMs
          for i in 0 1 2 3; do
            /usr/libexec/PlistBuddy -c "Delete :AvailableLibraries:$i:DebugSymbolsPath" \
              x/MapLibre.xcframework/Info.plist 2> /dev/null || true
          done
          cp LICENSE.md x/MapLibre.xcframework/
          (cd x && ditto -c -k --keepParent MapLibre.xcframework ../out/MapLibre.xcframework.zip)
          (cd "$BIN/MapLibre.dynamic_dsyms" &&
            ditto -c -k --keepParent MapLibre_ios_device.framework.dSYM "$GITHUB_WORKSPACE/out/MapLibre.framework.dSYM.zip")
          swift package compute-checksum out/MapLibre.xcframework.zip > out/checksum.txt
          ls -la out
          du -sh x/MapLibre.xcframework/ios-arm64/MapLibre.framework/MapLibre

      # 171: Bazel's default iPhone 15 is no device iOS 27 takes
      - name: Pick an iPhone the simulator's iOS takes
        run: |
          xcrun simctl list runtimes
          echo "SDK $(xcrun --sdk iphonesimulator --show-sdk-version) $(xcrun --sdk iphonesimulator --show-sdk-build-version)"
          xcrun simctl list runtimes -j | python3 -c '
          import json, re, sys
          ios = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          for r in ios:
              r["phones"] = [d["name"] for d in r["supportedDeviceTypes"] if d["productFamily"] == "iPhone"]
              print("iOS", r["version"], r["buildversion"], "takes", r["phones"], file=sys.stderr)
          newest = max((r for r in ios if r["phones"]), key=lambda r: [int(n) for n in r["version"].split(".")])
          plain = [p for p in newest["phones"] if re.fullmatch(r"iPhone \d+", p)] or newest["phones"]
          version = newest["version"]
          print(f"SIMULATOR=--ios_simulator_device={plain[0]}")
          print(f"SIMULATOR_IOS=--ios_simulator_version={version}")
          ' >> "$GITHUB_ENV"

      # not opt, whose NDEBUG drops the assertions upstream's tests expect to throw
      - name: Test ours on a simulator
        run: |
          # shellcheck disable=SC2086
          bazel test $BAZEL_CACHE $BAZEL_TEST "$SIMULATOR" "$SIMULATOR_IOS" --//:renderer=metal //platform/ios/riki-test:riki_test

      - name: Test upstream's iOS on a simulator
        if: success() || failure()
        run: |
          # shellcheck disable=SC2086
          bazel test $BAZEL_CACHE $BAZEL_TEST "$SIMULATOR" "$SIMULATOR_IOS" --//:renderer=metal //platform/ios/test:ios_test

      # each group alone: beside the others, xcodebuild missed the simulator Bazel had just made
      - name: Test the core's terrain camera
        if: success() || failure()
        env:
          FILTER: "*TerrainCamera*"
        run: |
          # shellcheck disable=SC2086
          bazel test $BAZEL_CACHE $BAZEL_TEST "$SIMULATOR" "$SIMULATOR_IOS" $BAZEL_FLAGS "--test_env=GTEST_FILTER=$FILTER" \
            //platform/ios/test/core:CppUnitTests

      - name: Test the core's tile and mesh cover
        if: success() || failure()
        env:
          FILTER: "*TileCover*:*MeshCover*:*TerrainSourceCover*"
        run: |
          # shellcheck disable=SC2086
          bazel test $BAZEL_CACHE $BAZEL_TEST "$SIMULATOR" "$SIMULATOR_IOS" $BAZEL_FLAGS "--test_env=GTEST_FILTER=$FILTER" \
            //platform/ios/test/core:CppUnitTests

      - name: Test the core's drape, elevation, fog, view settings, label heights and layer order
        if: success() || failure()
        env:
          FILTER: "*Terrain*:*Fog*:*StyleParsedLayers*:*SymbolZOffset*:Scheduler.Reply*:RenderingStats.*:*LayersBySource*:Retiring.*:DrapeBudget.*-*TerrainCamera*:*MeshCover*:*TerrainSourceCover*"
        run: |
          # shellcheck disable=SC2086
          bazel test $BAZEL_CACHE $BAZEL_TEST "$SIMULATOR" "$SIMULATOR_IOS" $BAZEL_FLAGS "--test_env=GTEST_FILTER=$FILTER" \
            //platform/ios/test/core:CppUnitTests

      # A test app that crashes takes its unflushed output with it; its crash report names the test.
      - name: Show why the tests stopped
        if: failure()
        run: |
          shopt -s nullglob
          mkdir -p out/testlogs
          for report in ~/Library/Logs/DiagnosticReports/*.ips; do
            echo "::group::$report"
            head -n 200 "$report"
            echo "::endgroup::"
            cp "$report" out/testlogs/
          done
          # ours and upstream's run without the release flags, so their logs lie elsewhere
          # shellcheck disable=SC2086
          for logs in "$(bazel info bazel-testlogs)" "$(bazel info $BAZEL_FLAGS bazel-testlogs)"; do
            cp -R "$logs/platform/ios" "out/testlogs/$(basename "$(dirname "$logs")")" 2> /dev/null || true
          done

      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ needs.check.outputs.sha }}
          path: out/testlogs
          retention-days: 7
          if-no-files-found: ignore

      # Kept under 6 GB by Bazel, inside the repository's 10 GB of Actions cache.
      - name: Save the Bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-ios-xcode27-${{ runner.arch }}-${{ needs.check.outputs.sha }}-${{ github.run_id }}

      - name: Release
        id: release
        if: needs.check.outputs.release == 'true'
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes 2> /dev/null || true
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "iOS terrain build ${SHA:0:7}" \
            --notes "MapLibre Native iOS from [${SHA:0:7}](https://github.com/$GITHUB_REPOSITORY/commit/$SHA): $(git log -1 --format=%s "$SHA")

          Checksum: \`$(cat out/checksum.txt)\`" \
            out/MapLibre.xcframework.zip out/MapLibre.framework.dSYM.zip out/checksum.txt

      # a dispatched Intel run was refused the release (HTTP 403); its build is kept a week
      - name: Keep the framework when the release fails
        if: failure() && steps.release.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.check.outputs.tag }}
          path: |
            out/MapLibre.xcframework.zip
            out/MapLibre.framework.dSYM.zip
            out/checksum.txt
          retention-days: 7

      - name: Mark the commit done
        if: always()
        env:
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$STATE" -f context=terrain-ios \
            -f target_url="$RUN_URL" -f description="Build and simulator tests: $STATE" || true
