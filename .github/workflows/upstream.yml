name: upstream

# Keeps a pull request open from each upstream branch we follow into master, and has
# terrain-ios test each new upstream head on a simulator. Nothing merges on its own.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  pull-requests: write
  statuses: read
  contents: read

concurrency:
  group: upstream
  cancel-in-progress: false

env:
  UPSTREAM: maplibre/maplibre-native
  BRANCHES: main feature/terrain-3d
  GH_TOKEN: ${{ github.token }}

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # upstream's files stay as they are, so its workflows are switched off, not deleted
      - name: Keep upstream's own workflows off
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows" \
            -q '.workflows[] | select(.state == "active") | "\(.id) \(.path)"' |
            while read -r id path; do
              case "$path" in
                .github/workflows/terrain-ios.yml | .github/workflows/upstream.yml) ;;
                .github/workflows/*)
                  echo "disabling $path"
                  gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/disable"
                  ;;
              esac
            done

      - name: Open the upstream pull requests and test their heads
        run: |
          owner=${UPSTREAM%%/*}
          for branch in $BRANCHES; do
            ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/master...$owner:$branch" -q .ahead_by)
            if [ "$ahead" = 0 ]; then
              echo "master has all of $branch."
              continue
            fi
            pr=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --base master \
                   --json number,headRepositoryOwner,headRefName \
                   -q "[.[] | select(.headRepositoryOwner.login == \"$owner\" and .headRefName == \"$branch\")][0].number // empty")
            if [ -z "$pr" ]; then
              # maintainer edits would need a grant on upstream's branch, which we cannot give
              pr=$(gh pr create -R "$GITHUB_REPOSITORY" --base master --head "$owner:$branch" \
                     --no-maintainer-edit --title "Upstream $branch comes in" --body "Booking." | grep -o '[0-9]*$')
              gh pr edit "$pr" -R "$GITHUB_REPOSITORY" --title "$pr Upstream $branch comes in" --body "$UPSTREAM's \`$branch\`, straight from upstream. It follows the branch as it moves.

          The \`terrain-ios\` status builds it merged into master and runs upstream's iOS tests and ours on a simulator, again each time upstream moves. Merge only when it is green on the head.

          On a conflict with our changes: branch off master, \`git pull https://github.com/$UPSTREAM.git $branch\`, resolve, build, and open a pull request from that branch instead.

          @skifahrer"
              echo "opened #$pr for $branch"
            fi
            head=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/status" \
                      -q '[.statuses[] | select(.context == "terrain-ios")][0].state // empty')
            if [ -z "$state" ]; then
              # a pull request by this token starts no workflow; a dispatch does
              gh workflow run terrain-ios.yml -R "$GITHUB_REPOSITORY" --ref master -f pr="$pr"
              echo "testing #$pr at ${head:0:7}"
            else
              echo "#$pr at ${head:0:7} is $state"
            fi
          done
